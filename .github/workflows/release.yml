name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    needs: tests
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
          - platform: "windows-latest"
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "floating todo ${{ github.ref_name }}"
          releaseBody: "下载下方对应平台安装包。macOS 首次打开若提示「已损坏」或「身份不明的开发者」，请见 README 的安装说明。Windows 首次运行若被 SmartScreen 拦截，点「更多信息 → 仍要运行」即可。"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Verify application inside macOS installer
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: bash scripts/verify-macos-dmg.sh src-tauri/target

      - name: Windows application smoke test
        if: matrix.platform == 'windows-latest'
        run: ./tests/native-smoke.ps1 -Executable src-tauri/target/release/floating-todo.exe

      - uses: actions/upload-artifact@v4
        if: always() && matrix.platform == 'windows-latest'
        with:
          name: windows-native-smoke
          path: test-results/native/
          if-no-files-found: ignore
          retention-days: 7

  release-android:
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android NDK and Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(ls -d "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "build-tools;35.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
  
      - name: Install Rust Android target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize Android project and network permissions
        run: |
          npm run tauri -- android init --ci
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          python3 -c '
          from pathlib import Path
          p = Path("'"$MANIFEST"'")
          text = p.read_text(encoding="utf-8")
          needle = "<uses-permission android:name=\"android.permission.INTERNET\" />"
          extra = "\n    <uses-permission android:name=\"android.permission.ACCESS_NETWORK_STATE\" />\n    <uses-permission android:name=\"android.permission.ACCESS_WIFI_STATE\" />\n    <uses-permission android:name=\"android.permission.CHANGE_WIFI_MULTICAST_STATE\" />"
          if "ACCESS_NETWORK_STATE" not in text and needle in text:
              p.write_text(text.replace(needle, needle + extra, 1), encoding="utf-8")
          '

      - name: Build Android ARM64 APK
        run: npm run tauri -- android build --apk --target aarch64

      - name: Sign and stage Android APK
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist-mobile
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$RAW_APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          ALIGNED="dist-mobile/aligned.apk"
          OUT_APK="dist-mobile/floating-todo_${TAG}_android-arm64.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" "$ALIGNED"
          keytool -genkeypair -v \
            -keystore dist-mobile/release.keystore \
            -alias floating-todo \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=floating-todo,OU=Release,O=floating-todo,L=Local,ST=Local,C=CN"
          "$BUILD_TOOLS/apksigner" sign \
            --ks dist-mobile/release.keystore \
            --ks-key-alias floating-todo \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$OUT_APK" "$ALIGNED"
          rm -f "$ALIGNED" dist-mobile/release.keystore dist-mobile/*.idsig
          ls -lh "$OUT_APK"

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist-mobile/*.apk
          retention-days: 7

  release-ios:
    needs: tests
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        run: |
          npm run tauri -- ios init --ci
          PLIST=$(find src-tauri/gen/apple -maxdepth 2 -name "Info.plist" | head -n 1)
          if [ -n "$PLIST" ]; then
            /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 用于发现并同步局域网内的待办设备" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _floatingtodo._tcp" "$PLIST" 2>/dev/null || true
          fi

      - name: Build unsigned iOS IPA
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm run tauri -- ios build --ci --no-sign
          mkdir -p dist-mobile
          OUT_IPA="$PWD/dist-mobile/floating-todo_${TAG}_ios-unsigned.ipa"
          BUILT_IPA=$(find src-tauri/gen/apple/build -name "*.ipa" | head -n 1 || true)
          if [ -n "$BUILT_IPA" ]; then
            cp "$BUILT_IPA" "$OUT_IPA"
          else
            APP_DIR=$(find src-tauri/gen/apple/build -name "*.app" | head -n 1)
            test -n "$APP_DIR"
            mkdir -p Payload
            cp -R "$APP_DIR" Payload/
            zip -qr "$OUT_IPA" Payload
            rm -rf Payload
          fi
          ls -lh "$OUT_IPA"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: dist-mobile/*.ipa
          retention-days: 7

  publish:
    needs: [release, release-android, release-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: mobile-assets
        continue-on-error: true

      - uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: mobile-assets
        continue-on-error: true

      - name: Upload mobile packages, normalize installer filenames and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          for f in mobile-assets/*.apk mobile-assets/*.ipa; do
            [ -f "$f" ] && gh release upload "$tag" "$f" --repo "${{ github.repository }}" --clobber
          done
          gh api "repos/${{ github.repository }}/releases/tags/$tag" \
            --jq '.assets[] | "\(.id) \(.name)"' | while read -r id name; do
            case "$name" in
              floating.todo_*|"floating todo_"*) gh api -X PATCH "repos/${{ github.repository }}/releases/assets/$id" \
                    -f name="floating-todo_${name#*_}" && echo "renamed $name -> floating-todo_${name#*_}" ;;
            esac
          done
          mkdir -p manifest-assets
          gh release download "$tag" --repo "${{ github.repository }}" \
            -p '*_aarch64.dmg' -p '*_x64.dmg' -p '*_x64-setup.exe' -p '*_arm64-setup.exe' \
            -D manifest-assets || true
          python3 - "$tag" "${{ github.repository }}" <<'PY'
          import hashlib, json, os, sys
          from pathlib import Path

          tag, repo = sys.argv[1], sys.argv[2]
          platforms = {}
          for path in sorted(Path("manifest-assets").glob("*")):
              if not path.is_file():
                  continue
              name = path.name
              lower = name.lower()
              if lower.endswith("_aarch64.dmg") or lower.endswith("_arm64.dmg"):
                  key = "darwin-aarch64"
              elif lower.endswith("_x64.dmg") or lower.endswith("_x86_64.dmg"):
                  key = "darwin-x86_64"
              elif lower.endswith("_x64-setup.exe"):
                  key = "windows-x86_64"
              elif lower.endswith("_arm64-setup.exe"):
                  key = "windows-aarch64"
              else:
                  continue
              h = hashlib.sha256()
              with path.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              platforms[key] = {
                  "name": name,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
                  "sha256": h.hexdigest(),
                  "size": path.stat().st_size,
              }
          manifest = {
              "version": tag.lstrip("v"),
              "tag": tag,
              "platforms": platforms,
          }
          Path("update-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          print("Generated update-manifest.json with platforms:", list(platforms.keys()))
          PY
          gh release upload "$tag" update-manifest.json --repo "${{ github.repository }}" --clobber
          gh release edit "$tag" --repo "${{ github.repository }}" --draft=false
